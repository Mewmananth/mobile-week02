<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หนูหมิวบิซคอม 👑 Princess Portfolio</title>
  
  <!-- Google Fonts: Mali (น่ารัก อ่อนหวาน) & Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,300;0,500;0,700;1,400&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-pink: #ffb6c1;
      --soft-pink: #fff0f5;
      --deep-pink: #e06387;
      --royal-gold: #e2b755;
      --gold-gradient: linear-gradient(135deg, #ffe082 0%, #e2b755 50%, #b8860b 100%);
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.9);
      --card-shadow: 0 15px 35px rgba(230, 115, 159, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Mali', 'Prompt', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffd1dc 0%, #fce4ec 30%, #f3e5f5 70%, #ffc1e3 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
      color: #5c3b4a;
    }

    /* วัตถุลอยพื้นหลัง (Sparkles & Stars) */
    .bg-sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
      animation: float-sparkle 6s infinite ease-in-out;
    }

    @keyframes float-sparkle {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.4; }
      50% { transform: translateY(-25px) rotate(15deg) scale(1.15); opacity: 0.9; }
    }

    /* การ์ดสไตล์ Glassmorphism เจ้าหญิง */
    .princess-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid var(--glass-border);
      border-radius: 36px;
      padding: 38px 24px 30px;
      box-shadow: var(--card-shadow), inset 0 0 15px rgba(255, 255, 255, 0.8);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .princess-card:hover {
      transform: translateY(-4px);
    }

    /* โบว์ / มงกุฎ ตกแต่งบนหัวการ์ด */
    .crown-badge {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--gold-gradient);
      padding: 6px 20px;
      border-radius: 20px;
      color: #fff;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 1px;
      box-shadow: 0 6px 16px rgba(218, 165, 32, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 2px solid #fff;
      animation: pulse-glow 2.5s infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 4px 15px rgba(226, 183, 85, 0.4); }
      50% { box-shadow: 0 6px 24px rgba(226, 183, 85, 0.8); }
    }

    /* กรอบรูปโปรไฟล์ */
    .avatar-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 10px auto 18px;
    }

    .avatar-glow {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: linear-gradient(45deg, #ff9ebb, #ffd54f, #f06292, #ce93d8);
      filter: blur(8px);
      opacity: 0.7;
      animation: spin 8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffeef5, #f8bbd0);
      border: 4px solid #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3.8rem;
      box-shadow: 0 8px 20px rgba(224, 99, 135, 0.25);
      overflow: hidden;
      user-select: none;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-sparkle {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: #fff;
      border-radius: 50%;
      padding: 4px;
      font-size: 1.1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* ชื่อและคำโปรย */
    .title-name {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--deep-pink);
      margin-bottom: 4px;
      text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.9), 0 0 12px rgba(255, 182, 193, 0.6);
    }

    .subtitle {
      font-size: 0.95rem;
      color: #925c74;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* รายการข้อมูลแต่ละหัวข้อ (Info List) */
    .info-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 26px;
      text-align: left;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid #ffe1eb;
      border-radius: 20px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 12px rgba(230, 115, 159, 0.08);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .info-box::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: var(--gold-gradient);
      border-radius: 5px 0 0 5px;
    }

    .info-box:hover {
      transform: translateX(4px);
      background: #ffffff;
      border-color: #f8bbd0;
      box-shadow: 0 6px 16px rgba(224, 99, 135, 0.18);
    }

    .info-icon {
      font-size: 1.6rem;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff5f8;
      border-radius: 14px;
      border: 1px solid #ffd6e4;
      flex-shrink: 0;
    }

    .info-content {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.82rem;
      color: #9c6c82;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .info-value {
      font-size: 1.08rem;
      font-weight: 700;
      color: #4a2838;
      margin-top: 2px;
    }

    /* ปุ่มวิบวับเสกหัวใจ */
    .magic-btn {
      width: 100%;
      background: linear-gradient(135deg, #f06292 0%, #e91e63 100%);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 13px 20px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(233, 30, 99, 0.35);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .magic-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 25px rgba(233, 30, 99, 0.45);
      background: linear-gradient(135deg, #ff4081 0%, #d81b60 100%);
    }

    .magic-btn:active {
      transform: scale(0.97);
    }

    /* ส่วนท้ายน่ารัก */
    .card-footer {
      margin-top: 18px;
      font-size: 0.8rem;
      color: #a8798e;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Floating Heart Effect เมื่อคลิกปุ่ม */
    .floating-heart {
      position: fixed;
      pointer-events: none;
      font-size: 1.5rem;
      animation: rise-and-fade 1.5s forwards ease-out;
      z-index: 999;
    }

    @keyframes rise-and-fade {
      0% {
        opacity: 1;
        transform: translateY(0) scale(0.8) rotate(0deg);
      }
      50% {
        transform: translateY(-80px) scale(1.2) rotate(15deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-160px) scale(1.4) rotate(-15deg);
      }
    }
  </style>
</head>
<body>

  <!-- ประกายวิบวับลอยด้านหลัง -->
  <div class="bg-sparkle" style="top: 8%; left: 10%; font-size: 2rem;">✨</div>
  <div class="bg-sparkle" style="top: 15%; right: 12%; font-size: 2.2rem; animation-delay: 1.5s;">💖</div>
  <div class="bg-sparkle" style="bottom: 12%; left: 8%; font-size: 1.8rem; animation-delay: 3s;">🌸</div>
  <div class="bg-sparkle" style="bottom: 10%; right: 10%; font-size: 2.5rem; animation-delay: 2s;">⭐</div>
  <div class="bg-sparkle" style="top: 45%; left: 5%; font-size: 1.5rem; animation-delay: 4s;">🎀</div>
  <div class="bg-sparkle" style="top: 55%; right: 5%; font-size: 1.6rem; animation-delay: 2.5s;">✨</div>

  <!-- การ์ดแนะนำตัวหลัก -->
  <main class="princess-card">
    
    <!-- มงกุฎประดับหัวการ์ด -->
    <div class="crown-badge">
      <span>👑</span> PRINCESS ROYAL <span>👑</span>
    </div>

    <!-- ส่วนรูปโปรไฟล์ / อวตาร -->
    <div class="avatar-wrapper">
      <div class="avatar-glow"></div>
      <div class="avatar">
        <!-- สามารถใส่รูปภาพจริงได้โดยเปลี่ยนเป็น <img src="รูปของคุณ.jpg" alt="หนูหมิว"> -->
        <span>👸🏻</span>
      </div>
      <div class="avatar-sparkle">💖</div>
    </div>

    <!-- ชื่อและสโลแกน -->
    <h1 class="title-name">หนูหมิวบิซคอม</h1>
    <p class="subtitle">✨ ยินดีต้อนรับสู่พื้นที่เจ้าหญิง ✨</p>

    <!-- ข้อมูลแนะนำตัว -->
    <section class="info-container">
      
      <!-- ชื่อเล่น -->
      <div class="info-box">
        <div class="info-icon">🎀</div>
        <div class="info-content">
          <span class="info-label">ชื่อเล่น / Nickname</span>
          <span class="info-value">หนูหมิวบิซคอม</span>
        </div>
      </div>

      <!-- สาขาวิชา -->
      <div class="info-box">
        <div class="info-icon">🎓</div>
        <div class="info-content">
          <span class="info-label">สาขาวิชา / Major</span>
          <span class="info-value">คอมพิวเตอร์ (BizCom)</span>
        </div>
      </div>

      <!-- ร้านโครงงาน -->
      <div class="info-box">
        <div class="info-icon">💻</div>
        <div class="info-content">
          <span class="info-label">ร้านโครงงาน / Project Store</span>
          <span class="info-value">ร้านคอมพิวเตอร์</span>
        </div>
      </div>

    </section>

    <!-- ปุ่มเวทมนตร์น่ารักๆ กดแล้วมีหัวใจลอย -->
    <button class="magic-btn" onclick="sendPrincessMagic(event)">
      <span>🪄</span> เสกเวทมนตร์ส่งกำลังใจ <span>✨</span>
    </button>

    <!-- เครดิตท้ายการ์ด -->
    <footer class="card-footer">
      <span>🏰</span> Cute Princess Portfolio &bull; 2026 <span>🌸</span>
    </footer>

  </main>

  <!-- สคริปต์เสกหัวใจ/ประกายลอยเมื่อคลิกปุ่ม -->
  <script>
    function sendPrincessMagic(e) {
      const items = ['💖', '✨', '👑', '🌸', '🎀', '⭐', '🪄'];
      
      for (let i = 0; i < 7; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.classList.add('floating-heart');
          heart.innerText = items[Math.floor(Math.random() * items.length)];
          
          // ตำแหน่งสุ่มรอบๆ ปุ่มที่กด
          const rect = e.target.getBoundingClientRect();
          const randomX = rect.left + (Math.random() * rect.width);
          const randomY = rect.top + (Math.random() * 20);
          
          heart.style.left = `${randomX}px`;
          heart.style.top = `${randomY}px`;
          
          document.body.appendChild(heart);

          // ลบออกเมื่ออนิเมชันเสร็จ
          setTimeout(() => {
            heart.remove();
          }, 1500);
        }, i * 100);
      }
    }
  </script>

</body>
</html>
